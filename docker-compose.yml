services:
  # --- MONGODB (Version Autonome & Stable pour les Tests) ---
  mongo_db:
    image: mongo:7.0
    container_name: ilot_mongo
    restart: always
    command: >
      bash -c "
        mongod --bind_ip_all --replSet rs0 &
        MONGO_PID=$$!
        echo '⏳ En attente de l éveil de MongoDB...'
        until mongosh --eval 'db.adminCommand(\"ping\")' > /dev/null 2>&1; do
          sleep 1
        done
        echo '🔗 Initialisation du Replica Set rs0...'
        mongosh --eval 'try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"127.0.0.1:27017\" }] }) } catch(e) { print(e) }'
        wait $$MONGO_PID
      "
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- NEO4J (Gare Centrale optimisée) ---
  neo4j_db:
    image: neo4j:5.12
    container_name: ilot_neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password777
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j-admin", "server", "status"]
      interval: 15s
      timeout: 10s
      retries: 3

  # --- ⚡ REDIS (Le Gardien du Cache & Rate Limiter) ---
  redis:
    image: redis:alpine
    container_name: ilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  neo4j_data:
  redis_data: